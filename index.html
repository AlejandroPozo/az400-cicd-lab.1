<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio colaborativo de CI/CD</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Laboratorio colaborativo de CI/CD</h1>
      <p>
        Cada estudiante trabajara en su propia rama para actualizar un componente, enviara un pull request,
        pasara por validacion automatica y revision, y luego se integrara a la rama principal para su despliegue.
      </p>
    </header>

    <main>
      <section aria-labelledby="student-grid-title" class="grid-section">
        <h2 id="student-grid-title">Componentes de estudiantes</h2>
        <div id="student-grid" class="student-grid" aria-live="polite"></div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
